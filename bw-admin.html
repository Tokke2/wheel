<!DOCTYPE html>
<html lang="sv" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <script>
    // GitHub Pages-skydd: extensloess URL (t.ex. /wheel/bw-admin) bryter relativa sokvagar ->
    // omdirigera till filnamnet med .html sa skript och CSS laddas alltid ratt.
    (function () {
      try {
        var p = location.pathname;
        if (!/\.(html?|php|webmanifest|png|jpg|svg|webp|mp4|webm|json|css|js|ico|xml|txt)$/i.test(p) && !/\/$/.test(p)) {
          location.replace(p.replace(/\/([^\/]+)$/, "/$1.html") + location.search + location.hash);
        }
      } catch (_e) {}
    })();
  </script>

  <title>Backstage Wheels — Kontrollpanel</title>
  <link rel="icon" type="image/png" sizes="192x192" href="bilder/app-icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bsw-wp-admin-body">
  <div id="bsw-admin-root">
    <div class="bsw-admin-auth-card" style="text-align: center;">
      <span class="bsw-kicker">BACKSTAGE WHEELS · KONTROLLPANEL</span>
      <h2 style="margin: 8px 0 8px; font-family: var(--font-display); text-transform: uppercase;">
        Ansluter säkert till kontrollpanelen...
      </h2>
      <p style="margin: 0; color: #94a3b8;">Laddar säkerhetsmodul och inställningar...</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
