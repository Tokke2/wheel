# Backstage Wheels — Automatisk utrullning (#1)
# ============================================================
# Sätt in era hemligheter i GitHub: repo → Settings → Secrets and variables → Actions:
#   FTP_HOST   (t ex ftp.loopia.se)      FTP_USER  (användarnamn)
#   FTP_PASS   (lösenord)                FTP_REMOTE_DIR (t ex /public_html — kan lämnas tom)
# Eller för VPS (SSH):
#   SSH_HOST   SSH_USER   SSH_PORT (valfritt, 22 som standard)   SSH_KEY (privat nyckel i PEM-format)
#   SSH_REMOTE_DIR (t ex /var/www/backstage-wheels)
#
# Kör manuellt via knappen "Run workflow", eller automatiskt vid varje push till branchen
# (förinställt: avstängt — byt "false" till "true" i trigger-sektionen nedan).

name: Deploy webbhotell / VPS

on:
  workflow_dispatch: {}   # Manuell körning i GitHub → Actions-fliken
  # push:                  # Slå på auto-deploy vid push: ta bort "#" på dessa två rader
  #   branches: [ "arena/51e035c2-wheel" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      # ---------- ALTERNATIV A: WEBBHOTELL VIA FTP (Loopia, Oderland, One.com…) ----------
      - name: FTP-rulla ut filerna
        if: ${{ vars.DEPLOY_TARGET == 'ftp' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_REMOTE_DIR || './' }}
          exclude: |
            **/.git*
            **/.github*
            **/node_modules*
            **/data/*.json
            **/data/.vault.key
            **/bilder/galleri/**

      # ---------- ALTERNATIV B: VPS VIA SSH (pull + omstart) ----------
      - name: SSH-rulla ut filerna (rsync + omstart av Node-servern)
        if: ${{ vars.DEPLOY_TARGET == 'ssh' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          target: ${{ secrets.SSH_REMOTE_DIR }}
          source: "."
          rm: "false"
          strip_components: "0"
          overwrite: "true"
          exclude: ".git*,.github*,node_modules*,data/*.json,data/.vault.key,bilder/galleri/**"

      - name: Starta om Node-servern på VPS
        if: ${{ vars.DEPLOY_TARGET == 'ssh' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.SSH_REMOTE_DIR }}
            npm install --omit=dev 2>/dev/null || true
            (pm2 restart backstage-wheels || pm2 start server.js --name backstage-wheels) 2>/dev/null || (systemctl restart backstage-wheels 2>/dev/null || (pkill -f 'node server.js' || true; nohup node server.js > /dev/null 2>&1 &))

      - name: Skippa (ingen DEPLOY_TARGET vald)
        if: ${{ vars.DEPLOY_TARGET != 'ftp' && vars.DEPLOY_TARGET != 'ssh' }}
        run: |
          echo "Sätt repo-variabeln DEPLOY_TARGET till 'ftp' eller 'ssh' (Settings → Variables) och fyll i motsvarande secrets."
          echo "Se README-FTP.md för steg-för-steg. Ingen filer rullades ut i den här körningen."
